name: Day 3 - GHCR Docker Package & OCI Deploy Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        shell: bash
        run: |
          echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ghcr.io/${{ env.REPO_NAME }}:latest

  deploy:
    needs: build-and-publish  # Runs only after the Docker image is built and pushed
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud Instance via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu  # Change to 'opc' if you use Oracle Linux
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd dietitian-app
            git pull origin main
            docker compose up --build -d
